[package]
name = "vynl-player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Dual playback engine (librespot integrated player + Connect sync policy) for vynl"

[features]
default = ["rodio-backend"]
# Cross-platform rodio/cpal backend (Linux/macOS/Windows)
rodio-backend = [
    "dep:rodio",
    "dep:librespot-core",
    "dep:librespot-playback",
    "dep:librespot-connect",
    "dep:tokio",
    "librespot-playback/rodio-backend",
]
# 100% pure-Rust PCM subprocess backend (musl, FreeBSD, exotic targets)
subprocess-backend = [
    "dep:librespot-core",
    "dep:librespot-playback",
    "dep:librespot-connect",
    "dep:tokio",
]
# Optional FFT spectrum tap for Zen-mode audio visualizer
visualizer = []

[dependencies]
vynl-core.workspace = true
rodio = { workspace = true, optional = true }
librespot-core = { workspace = true, optional = true }
librespot-playback = { workspace = true, optional = true }
librespot-connect = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
