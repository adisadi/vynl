[workspace]
resolver = "3"
members = [
    "crates/vynl-core",
    "crates/vynl-spotify",
    "crates/vynl-player",
    "crates/vynl-images",
    "crates/vynl-system",
    "crates/vynl-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/adisadi/vynl"
keywords = ["spotify", "tui", "terminal", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[workspace.dependencies]
vynl-core = { version = "0.1.0", path = "crates/vynl-core" }
vynl-spotify = { version = "0.1.0", path = "crates/vynl-spotify" }
vynl-player = { version = "0.1.0", path = "crates/vynl-player" }
vynl-images = { version = "0.1.0", path = "crates/vynl-images" }
vynl-system = { version = "0.1.0", path = "crates/vynl-system" }

# Phase 2+ external crates (Pure-Rust & Cross-Compile-First; zero openssl-sys / libsqlite3-sys):
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
redb = "2"
nucleo = "0.5"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
keyring = { version = "3", default-features = false }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
notify-rust = { version = "4", default-features = false, features = ["z"] }
insta = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
