[workspace]
resolver = "3"
members = [
    "crates/vynl-core",
    "crates/vynl-spotify",
    "crates/vynl-player",
    "crates/vynl-images",
    "crates/vynl-system",
    "crates/vynl-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/adisadi/vynl"
keywords = ["spotify", "tui", "terminal", "music", "ratatui"]
categories = ["command-line-utilities", "multimedia::audio"]

[workspace.dependencies]
vynl-core = { version = "0.1.0", path = "crates/vynl-core" }
vynl-spotify = { version = "0.1.0", path = "crates/vynl-spotify" }
vynl-player = { version = "0.1.0", path = "crates/vynl-player" }
vynl-images = { version = "0.1.0", path = "crates/vynl-images" }
vynl-system = { version = "0.1.0", path = "crates/vynl-system" }

# Phase 1+ external crates (Pure-Rust & Cross-Compile-First; uncomment as each phase lands):
# ratatui = "0.29"
# crossterm = "0.28"
# ratatui-image = "4"
# image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
# reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"
# toml = "0.8"
# redb = "2"
# nucleo = "0.5"
# clap = { version = "4", features = ["derive"] }
# directories = "6"
# tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# librespot-core = "0.6"
# librespot-playback = { version = "0.6", default-features = false }
# librespot-connect = "0.6"
# souvlaki = "0.8"
# notify-rust = { version = "4", default-features = false, features = ["z"] }
# rustfft = "6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dist]
inherits = "release"
lto = "fat"
