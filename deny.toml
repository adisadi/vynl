# cargo-deny configuration for vynl (GPL-3.0-or-later, Pure-Rust / Cross-Compile-First)
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-freebsd",
]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Upstream librespot-core 0.8.0 transitive dependencies (no newer crates.io release yet;
    # remove as soon as librespot upgrades rsa, quick-xml, and hyper-proxy2 -> rustls 0.23):
    # - rsa 0.9.10 (Marvin Attack; no upstream 0.10 release yet)
    "RUSTSEC-2023-0071",
    # - quick-xml 0.38.4 (pinned by librespot-core 0.8.0; vynl does not parse untrusted XML)
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # - rustls 0.22.4 & rustls-webpki 0.102.8 (pinned by librespot-core 0.8.0 -> hyper-proxy2 0.1.0;
    #   vynl's own reqwest HTTP client uses patched rustls 0.23 + rustls-webpki 0.103)
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",
    "RUSTSEC-2026-0382",
]

[licenses]
# All licenses permitted for a GPL-3.0-or-later project
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Enforce Pure-Rust TLS (rustls) and embedded storage (redb) for painless cross-compilation:
    { name = "openssl-sys", reason = "Use rustls instead of OpenSSL to preserve cross-compilation portability" },
    { name = "libsqlite3-sys", reason = "Use pure-Rust redb instead of C SQLite for cross-compilation portability" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
